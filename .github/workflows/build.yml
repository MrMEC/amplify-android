name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  # Queue rather than cancel: a build cancelled while it was replacing the release left the
  # release as an unpublished draft, and the APK link gave a 404 (build 370).
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build number
        run: echo "BUILD=$(( ${{ github.run_number }} + 40 ))" >> "$GITHUB_ENV"

      - name: Stamp the build number into the app (Settings > Build)
        run: sed -i "s/var APP_BUILD = '[^']*';/var APP_BUILD = '$BUILD';/" www/index.html && grep -n "var APP_BUILD" www/index.html

      - name: Embed the default Zen preset GIFs
        run: ./scripts/fetch-zen-art.sh

      - name: Install
        run: npm ci

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build APK
        id: build
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Publish result to the build-output branch
        if: always()
        env:
          RESULT: ${{ steps.build.outcome }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          if [ -f build.log ]; then cp build.log out/build.log; tail -c 80000 build.log > out/build-tail.log; else echo "no build log" > out/build.log; fi
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then cp "$APK" out/Amplify.apk; fi
          echo "build=$BUILD run=${{ github.run_number }} sha=${{ github.sha }} result=$RESULT" > out/status.txt
          cd out
          git init -q -b build-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build $BUILD: $RESULT"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" build-output

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/Amplify.apk \
            --target "${{ github.sha }}" \
            --title "Amplify build $BUILD" \
            --notes "Open this page on the phone and tap Amplify.apk to install or update."
          # Make sure it is published, not left as a draft (whose download link is a 404).
          gh release edit latest --draft=false
          # And that the APK link answers.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "https://github.com/${{ github.repository }}/releases/download/latest/Amplify.apk")
            echo "APK link: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "The APK link isn't answering" >&2
          exit 1
