name: URL check
on:
  push:
    branches: ['tests-*']
    paths: ['tests/urls.txt', '.github/workflows/url-check.yml']
jobs:
  urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          out=""
          while read -r u; do [ -z "$u" ] && continue
            r=$(curl -sS -o /tmp/b -w '%{http_code} %{content_type} %{size_download}' -A 'Mozilla/5.0 (Linux; Android 14; wv) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36' -H 'Accept: image/avif,image/webp,image/*,*/*' "$u" 2>&1)
            out="$out$r  $u"$'\n'
          done < tests/urls.txt
          python3 -c "import sys; t=sys.argv[1]; print('::notice title=URLs::' + t.replace('%','%25').replace('\n','%0A'))" "$out"
