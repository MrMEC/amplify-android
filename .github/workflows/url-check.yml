name: URL check
on:
  push:
    branches: ['tests-*']
    paths: ['tests/urls.txt', '.github/workflows/url-check.yml']
jobs:
  urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          out=""
          while read -r u; do [ -z "$u" ] && continue
            h=$(curl -sS -o /dev/null -D - -A 'Mozilla/5.0 (Linux; Android 14; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/130.0 Mobile Safari/537.36' \
              -H 'Accept: image/avif,image/webp,image/*,*/*;q=0.8' -H 'X-Requested-With: com.markcoleman.amplify' -H 'Sec-Fetch-Dest: image' -H 'Sec-Fetch-Mode: no-cors' -H 'Sec-Fetch-Site: cross-site' "$u" 2>&1 \
              | grep -i '^HTTP\|cross-origin\|content-type\|x-content-type\|access-control\|timing' | tr '\r\n' '  ')
            out="$out$h  <= $u"$'\n'
          done < tests/urls.txt
          python3 -c "import sys; t=sys.argv[1]; print('::notice title=URLs::' + t.replace('%','%25').replace('\n','%0A'))" "$out"
