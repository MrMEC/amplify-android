name: JVM tests
# Build 274: plain-Java tests that need jars from Maven (kxml2, org.json). Runs on test branches.
on:
  push:
    branches: ['tests-*']
  workflow_dispatch:
jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: PodcastFeeds
        shell: bash
        run: |
          set +e
          sh tests/java/run_podcast_feeds.sh > out.txt 2>&1; rc=$?
          # The output as one annotation (readable through the checks API).
          grep -v '^ *[\[\]{}"]' out.txt | tail -c 3800 | python3 -c "import sys; t=sys.stdin.read(); print('::notice title=PodcastFeeds::' + t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
          exit $rc
