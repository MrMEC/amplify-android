apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def BUILD_OFFSET = 40
ext.amplifyBuild = { ->
    def run = System.getenv("GITHUB_RUN_NUMBER")
    return run ? (run as Integer) + BUILD_OFFSET : 1
}

android {
    namespace = "com.markcoleman.amplify"
    compileSdk = rootProject.ext.compileSdkVersion
    // VLC's native library is ~50 MB uncompressed. Stored compressed in the APK it is a fraction
    // of that to download with each build; Android unpacks it once on install.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    defaultConfig {
        applicationId "com.markcoleman.amplify"
        // LibVLC carries native libraries for four processor types, tens of MB each. The phone
        // this is built for (and any 64-bit Android phone) only needs arm64-v8a (build 153).
        ndk {
            abiFilters 'arm64-v8a'
        }
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Build number = GitHub run number + BUILD_OFFSET. Builds 7-48 were made outside this repo (the phone had 1.0.48),
        // so the offset keeps new builds numbered above 48 and able to install over them.
        versionCode amplifyBuild()
        versionName "1.0." + amplifyBuild()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // A fixed key, kept in the repo, so each new build installs over the last one
        // (Android refuses an update signed with a different key). Personal sideload use only.
        amplify {
            storeFile file('amplify.keystore')
            storePassword 'amplify-personal'
            keyAlias 'amplify'
            keyPassword 'amplify-personal'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.amplify
        }
        release {
            signingConfig signingConfigs.amplify
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
    implementation "androidx.media3:media3-session:1.8.0"
    // VLC, for videos the phone's own decoders can't play (build 153). 3.x is the stable line.
    implementation "org.videolan.android:libvlc-all:3.7.6"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
